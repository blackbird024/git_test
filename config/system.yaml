# Reglas PROPIAS del sistema: siempre más estrictas que las de la prop firm.
# Todo es configurable. Los valores iniciales son conservadores a propósito.

firma: apex_eod        # archivo en config/firms/
cuenta: 50K

modo: semiautomatico   # el sistema avisa; tú colocas la orden bracket (stop + objetivo) a mano

riesgo:
  riesgo_por_operacion_usd: 150       # pérdida máxima si salta el stop (~7,5 % del drawdown de 50K)
  limite_diario_sistema_pct: 0.50     # paramos al perder el 50 % del límite diario de Apex (500 $ en 50K)
  margen_sobre_umbral_eod_usd: 300    # nunca abrir una operación que, si falla, nos deje a menos de esto del umbral
  max_operaciones_por_dia: 3          # tiene que ser manejable a mano
  ratio_min_objetivo_stop: 1.0        # Apex prohíbe objetivos pequeños con stops enormes

horario_et:
  inicio_sesion: "09:30"
  cierre_forzado: "15:50"             # margen amplio respecto a las 16:59 de Apex

ejecucion_manual:
  retraso_entrada_barras: 1           # un humano tarda: entramos en la apertura de la vela SIGUIENTE a la señal

conflictos:
  # Si una estrategia quiere comprar MNQ y otra ya está vendida en MNQ (o al revés),
  # la nueva señal se ignora. Así nunca hay posiciones opuestas.
  politica: primera_senal_manda
