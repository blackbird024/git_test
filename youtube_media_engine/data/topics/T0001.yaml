id: T0001
titulo_trabajo: ¿Por qué el teclado es QWERTY?
pregunta_central: Si nadie lo diseñaría así hoy, ¿por qué seguimos escribiendo en QWERTY?
audiencia: 'Hispanohablantes curiosos, 18-45 (persona: Lucía)'
formato: documental_corto
duracion_min: 10
gancho: 'Abrir con el teclado de 1868: dos filas y teclas como de piano. Esa fue la versión 1.'
estructura:
- 'Versión 1.0: el teclado tipo piano de Sholes'
- La explicación que todo el mundo repite (atascos)
- 'Giro: los telegrafistas y la hipótesis de Yasuoka'
- '1878: la patente donde aparece QWERTY'
- '1893: la fusión que lo convirtió en estándar'
- ¿Es peor que Dvorak? El debate David / Liebowitz-Margolis
- Lo que sabemos / lo que no
recompensa: Entender que un estándar no gana por ser el mejor, sino por llegar primero y quedarse.
angulo_original: Casi todos los vídeos repiten lo de los atascos; aquí se contrasta con documentos y artículos académicos.
