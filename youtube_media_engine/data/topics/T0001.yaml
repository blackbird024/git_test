complejidad: media
riesgos:
- 'El mito de los atascos está muy extendido: el guion debe presentarlo como explicación popular, no como falsa sin matices'
- La hipótesis de Yasuoka es una interpretación académica, no un hecho cerrado
- Las imágenes de las patentes de EE. UU. son de dominio público; comprobar la fuente de cada escaneo
por_que_atrae: Todo el mundo usa el teclado a diario y casi nadie sabe por qué es así; además, desmonta un mito muy repetido.
miniatura: Teclado dibujado con QWERTY resaltado + '¿Por qué QWERTY?' + sello '¿MITO?' (reports/marca/miniatura_ejemplo.png)
