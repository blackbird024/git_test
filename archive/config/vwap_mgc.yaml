# Tendencia con VWAP en MGC con stops anchos (criterios fijados ANTES de ver resultados).
# Ejecutar: python scripts/run_study.py --estudio vwap_mgc
# Mismas reglas que src/strategies/vwap_trend.py (que tenía ventaja bruta en 7 de 8 años con stops de
# 0,1-0,2 ATR); solo cambia el stop, más ancho, para que los costes pesen menos por unidad de riesgo.

instrumento:
  simbolo: MGC
  datos: GC
  valor_punto_usd: 10.0
  tick: 0.10

horario_et:
  primera_senal: "10:00"
  ultima_senal: "14:30"
  salida_tiempo: "15:45"

atr_dias: 14
stop_atr: 0.4                 # stop al otro lado del VWAP, a k x ATR diario
take_profit_r: 2.0

riesgo:
  riesgo_por_operacion_usd: 150
  contratos_max: 10
  contratos_fijos: null

costes:
  comision_por_contrato_y_lado_usd: 1.00
  slippage_ticks_entrada: 1
  slippage_ticks_stop: 1
  slippage_ticks_salida_tiempo: 0
  slippage_ticks_take_profit: 0

apex:
  saldo_inicial: 50000
  drawdown_trailing_usd: 2000
  trailing_se_detiene_en: null

validacion:
  fecha_inicio: "2015-01-01"
  fecha_fin: null
  fraccion_desarrollo: 0.70
  variantes_stop_atr: [0.4, 0.8]
  variantes_riesgo_usd: [150, 250]
  diagnostico_contratos_fijos: 1
  montecarlo_simulaciones: 10000
  semilla: 42

criterios:
  profit_factor_min: 1.15
  t_min: 2.0
  positivo_en_desarrollo_y_oos: true
