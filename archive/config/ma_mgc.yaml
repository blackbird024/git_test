# Cruce de medias móviles con filtro de rango (ADX) en MGC. Criterios fijados ANTES de ver resultados.
# Ejecutar: python scripts/run_study.py --estudio ma_mgc
# Entrada: cruce de EMA rápida y lenta al cierre de una vela de 5 min (10:00-15:00 ET), solo si el ADX(14)
# supera el umbral (mercado con tendencia, no en rango). Salida: cruce contrario (con giro si el filtro lo
# permite), stop de emergencia a k x ATR diario, o cierre a las 15:45. Máximo 3 operaciones al día.

instrumento:
  simbolo: MGC
  datos: GC
  valor_punto_usd: 10.0
  tick: 0.1

velas_minutos: 5
horario_et:
  primera_senal: "10:00"
  ultima_senal: "15:00"      # inicio de la vela de señal (excluida)
  salida_tiempo: "15:45"

ema_rapida: 9
ema_lenta: 21
adx_periodo: 14
adx_minimo: 20               # null = sin filtro de rango
atr_dias: 14
stop_atr: 0.25
max_operaciones_dia: 3

riesgo:
  riesgo_por_operacion_usd: 250
  contratos_max: 10
  contratos_fijos: null

costes:
  comision_por_contrato_y_lado_usd: 1.00
  slippage_ticks_entrada: 1
  slippage_ticks_stop: 1
  slippage_ticks_salida_tiempo: 1   # salidas a mercado (cruce contrario y 15:45)
  slippage_ticks_take_profit: 0

apex:
  saldo_inicial: 50000
  drawdown_trailing_usd: 2000
  trailing_se_detiene_en: null

validacion:
  fecha_inicio: "2015-01-01"
  fecha_fin: null
  fraccion_desarrollo: 0.70
  variantes_medias: [[9, 21], [20, 50]]
  variantes_adx: [null, 20, 25]
  diagnostico_contratos_fijos: 1
  montecarlo_simulaciones: 10000
  semilla: 42

criterios:
  profit_factor_min: 1.15
  t_min: 2.0
  positivo_en_desarrollo_y_oos: true
